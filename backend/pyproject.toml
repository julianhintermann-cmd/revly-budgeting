[project]
name = "revly-budgeting-backend"
version = "0.1.0"
description = "Backend of revly-budgeting: self-hosted envelope budgeting"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Fixtures must share the test's event loop, otherwise SQLAlchemy's greenlet
# bridge breaks (MissingGreenlet) when the engine is created in a fixture.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
