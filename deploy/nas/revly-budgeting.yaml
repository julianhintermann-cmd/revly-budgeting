# ============================================================================
# revly-budgeting – Deploy für das UGREEN-NAS (192.168.1.125)
# ============================================================================
# Ablage:  /volume2/docker/revly-budgeting/revly-budgeting.yaml
#
# Keine Vorbereitung nötig: Das Image legt die Ordner beim ersten Start selbst
# an, setzt die Berechtigungen (chown auf UID 1000) und droppt dann auf den
# unprivilegierten App-User. Ordner müssen NICHT vorab existieren.
#
# Start:   docker compose -f revly-budgeting.yaml up -d
# Update:  docker compose -f revly-budgeting.yaml pull
#          docker compose -f revly-budgeting.yaml up -d
# Logs:    docker logs -f revly-budgeting
#
# Danach:  http://192.168.1.125:3064  (erster registrierter User = Admin)
#
# Port 3064: laut Port-Übersicht im Vault frei (3050 Revly, 3060 Second Brain,
# 3061 ntfy, 3062 Revly-Tickets, 3063 Hustlify). Vor dem Start gegen die
# Live-Realität prüfen:  docker ps --format 'table {{.Names}}\t{{.Ports}}'
#
# Extern (optional): In Nginx Proxy Manager einen Host
#   budget.jucloudy.com -> http://192.168.1.125:3064   anlegen.
# ============================================================================

services:
  revly-budgeting:
    image: <DOCKERHUB_USERNAME>/revly-budgeting:latest
    container_name: revly-budgeting
    restart: unless-stopped
    ports:
      - "3064:8000"
    volumes:
      # Golden Rule:
      #   Config/Runtime (SECRET_KEY)      -> Volume 2 (SSD)
      #   Bulk-Daten (SQLite-DB + Belege)  -> Volume 1 (HDD)
      - /volume2/docker/revly-budgeting:/config
      - /volume1/data/revly-budgeting:/data
    environment:
      - TZ=Europe/Berlin
      - DEFAULT_LOCALE=de
      - DATA_DIR=/config
      - DATABASE_URL=sqlite+aiosqlite:////data/revly.db
      - UPLOAD_DIR=/data/uploads
      # - SECRET_KEY=bitte-langen-zufallswert-setzen   # optional; ohne wird einer generiert und in /data persistiert
      # - ALLOWED_ORIGINS=https://budget.jucloudy.com  # nur nötig bei Zugriff über eigene Domain/anderen Origin
      # - DATABASE_URL=postgresql://user:pass@host:5432/revly   # optional statt SQLite
    # Der Healthcheck ist im Image eingebaut (GET /api/health alle 30s).
    # Hinweis: KEIN "user:" setzen – der Entrypoint braucht den Root-Start,
    # um die Bind-Mount-Rechte zu setzen, und wechselt danach selbst auf UID 1000.
